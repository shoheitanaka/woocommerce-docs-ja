name: Sync Upstream Documentation

on:
  schedule:
    # 3日に1回、午前2時（JST）に実行（UTC 17:00）
    - cron: '0 17 */3 * *'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      force_sync:
        description: 'Force full sync (ignore cache)'
        required: false
        default: 'false'

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch upstream changes
        id: fetch
        run: |
          # 上流リポジトリを追加
          git remote add upstream https://github.com/${{ secrets.UPSTREAM_REPO || 'woocommerce/woocommerce' }}.git || true
          git fetch upstream trunk
          
          # 差分をチェック
          CHANGES=$(git diff --name-only upstream/trunk -- docs/)
          
          if [ -z "$CHANGES" ]; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            echo "$CHANGES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Sync upstream documentation
        if: steps.fetch.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          npm run sync
      
      - name: Create translation cache
        if: steps.fetch.outputs.has_changes == 'true'
        run: |
          node scripts/cache-manager.js update
      
      - name: Create Pull Request
        if: steps.fetch.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "docs: sync upstream documentation changes"
          title: "🔄 Upstream Documentation Update"
          body: |
            ## 📝 上流ドキュメントの更新を検出しました
            
            このPRは自動的に作成されました。
            
            ### 変更されたファイル
            ```
            ${{ steps.fetch.outputs.changed_files }}
            ```
            
            ### 次のステップ
            1. ✅ 変更内容を確認
            2. ✅ 必要に応じて翻訳を調整
            3. ✅ PRをマージ
            4. 🚀 マージ後、自動的に翻訳とデプロイが実行されます
            
            ### 翻訳について
            - DeepL APIを使用して自動翻訳されます
            - 変更された部分のみ翻訳（差分翻訳）
            - キャッシュを使用してAPIコールを最適化
            
            ---
            🤖 Generated by GitHub Actions
          branch: translation/update-${{ github.run_number }}
          delete-branch: true
          labels: |
            translation
            auto-generated
            documentation
      
      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Has changes: ${{ steps.fetch.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Force sync: ${{ github.event.inputs.force_sync }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fetch.outputs.has_changes }}" == "true" ]; then
            echo "- Changed files:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.fetch.outputs.changed_files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
